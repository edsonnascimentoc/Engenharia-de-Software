name: Security Governance Pipeline (SCA, SBOM & CVE Check)

on:
  push:
    branches: [ "main", "master", "develop", "feat/*" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security-and-secret-scan:
    name: Security and Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Audit Secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@6c05c4a00b91aa542267d8e32a8254774799d68d # v3.93.8
        with:
          head: ${{ github.head_ref }}
          base: ${{ github.base_ref }}

      - name: Generate Software Bill of Materials (SBOM)
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Scan Repository & SBOM for CVEs (Trivy)
        uses: aquasecurity/trivy-action@91e7c2c36dcad14149d8e455b960af62a2ffb275 # 0.33.1
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: false

      - name: Upload SARIF report to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'