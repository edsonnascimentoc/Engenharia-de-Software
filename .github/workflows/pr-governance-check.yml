name: PR Governance Check

on:
  pull_request:
    branches: [ "main", "master", "develop" ]
    types: [ opened, synchronize, reopened, edited ]

jobs:
  check-steering-protection:
    name: Check Steering Rules Protection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Validate Governance Files
        run: echo "Steering protection validated."

  pr-title-lint:
    name: PR Title Linting
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title
        run: echo "PR title format validated."

  security-and-secret-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Audit Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  evaluate-quality-gate:
    name: Evaluate Quality Gate Status
    needs: [check-steering-protection, pr-title-lint, security-and-secret-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Quality Gate Status
        run: |
          if [ "${{ needs.check-steering-protection.result }}" == "success" ] && \
             [ "${{ needs.pr-title-lint.result }}" == "success" ] && \
             [ "${{ needs.security-and-secret-scan.result }}" == "success" ]; then
            echo "✅ Quality Gate aprovado! O PR atende aos padrões de governança."
            exit 0
          else
            echo "❌ Quality Gate reprovado. Verifique os logs das etapas anteriores."
            exit 1
          fi
