name: Issue Requirements Validation

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Número da issue para validar manualmente'
        required: true
        type: string

jobs:
  validate-and-review-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Buscar e validar a issue
        id: fetch_issue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const rawIssueNumber = context.eventName === 'workflow_dispatch'
              ? context.payload.inputs?.issue_number
              : context.payload.issue?.number;
            const rawValue = String(rawIssueNumber ?? '');
            if (!/^[1-9]\d*$/.test(rawValue)) {
              throw new Error('Número da issue inválido: informe um inteiro positivo.');
            }

            const issueNumber = Number(rawValue);
            if (!Number.isSafeInteger(issueNumber)) {
              throw new Error('Número da issue fora do intervalo permitido.');
            }

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });
            if (issue.pull_request) {
              throw new Error(`#${issueNumber} é um pull request, não uma issue.`);
            }

            const inputPath = path.join(process.env.RUNNER_TEMP, 'issue-review-input.json');
            fs.writeFileSync(inputPath, JSON.stringify({
              issue_number: issue.number,
              body: issue.body ?? ''
            }), { encoding: 'utf8', mode: 0o600 });
            core.setOutput('issue_number', String(issue.number));
            core.info(`Issue #${issue.number} carregada para validação estrutural.`);

      - name: Validar conteúdo e gerar resultado
        id: review
        env:
          ISSUE_REVIEW_INPUT: ${{ runner.temp }}/issue-review-input.json
          ISSUE_REVIEW_RESULT: ${{ runner.temp }}/agent-review-result.json
        run: >-
          node .github/agents/runner.js
          --input-file "$ISSUE_REVIEW_INPUT"
          --result-file "$ISSUE_REVIEW_RESULT"

      - name: Publicar resultado da validação
        if: always() && steps.fetch_issue.outcome == 'success'
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ steps.fetch_issue.outputs.issue_number }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            if (!Number.isSafeInteger(issueNumber) || issueNumber < 1) {
              throw new Error('O número da issue validado não está disponível.');
            }

            const resultPath = path.join(process.env.RUNNER_TEMP, 'agent-review-result.json');
            if (!fs.existsSync(resultPath)) {
              throw new Error('O validador não produziu resultado; nenhum comentário ou label foi aplicado.');
            }
            const result = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
            if (result.issue_number !== issueNumber
                || typeof result.approved !== 'boolean'
                || !Array.isArray(result.required_actions)) {
              throw new Error('O resultado do validador é inválido ou pertence a outra issue.');
            }

            const labelName = result.approved
              ? 'status: ready-for-dev'
              : 'status: needs-refinement';
            const repositoryLabels = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            if (!repositoryLabels.some((label) => label.name === labelName)) {
              throw new Error(`A label requerida "${labelName}" não existe; nenhum comentário ou label foi aplicado.`);
            }

            const body = result.approved
              ? `✅ **Validação estrutural aprovada**\n\n${result.feedback_summary}\n\nEsta verificação automatizada não substitui a revisão semântica.`
              : `⚠️ **A issue precisa de refinamento**\n\n${result.feedback_summary}\n\n**Ações necessárias:**\n${result.required_actions.map((action) => `- ${action}`).join('\n')}`;

            await github.rest.issues.createComment({
              issue_number: issueNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
            await github.rest.issues.addLabels({
              issue_number: issueNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: [labelName]
            });
