name: MCP Agent Issue Validation & Refinement

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:

jobs:
  validate-and-review-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Setup Node.js / Ambiente MCP
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Executar Agente Issue Reviewer (Validação EARS + ISO 29148)
        id: reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          echo "Iniciando validação da Issue #${ISSUE_NUMBER}..."
          node .github/agents/runner.js             --agent issue-reviewer             --issue-id "${ISSUE_NUMBER}"             --rules-path .github/agents/prompts/issue-reviewer-prompt.txt

      - name: Feedback Automático na Issue
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('./agent-review-result.json')) {
              console.error('Arquivo de resultado não encontrado.');
              return;
            }
            const result = JSON.parse(fs.readFileSync('./agent-review-result.json', 'utf8'));
            
            if (result.approved) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `✅ **Aprovação Automática de Governança (ISO 29148 / EARS)**\n\nA Issue está em conformidade com as regras de especificação formal e pronta para codificação.`
              });
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['status: ready-for-dev']
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `⚠️ **Revisão de Qualidade Requer Alterações (ISO 29148 / EARS)**\n\n${result.feedback_summary}\n\n**Ações Necessárias:**\n` + 
                      result.required_actions.map(a => `- ${a}`).join('\n')
              });
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['status: needs-refinement']
              });
            }
