name: MCP Agent Issue Validation & Refinement

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Número da Issue para validar manualmente'
        required: true
        type: string

jobs:
  validate-and-review-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Setup Node.js / Ambiente MCP
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Determinar Número da Issue
        id: get_issue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "issue_number=${{ github.event.inputs.issue_number }}" >> $GITHUB_OUTPUT
          else
            echo "issue_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Executar Agente Issue Reviewer (Validação EARS + ISO 29148)
        id: reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_NUMBER: ${{ steps.get_issue.outputs.issue_number }}
        run: |
          echo "Iniciando validação da Issue #${ISSUE_NUMBER}..."
          node .github/agents/runner.js \
            --agent issue-reviewer \
            --issue-id "${ISSUE_NUMBER}" \
            --rules-path .github/agents/prompts/issue-reviewer-prompt.txt

      - name: Feedback Automático na Issue
        if: always()
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const issueNumber = parseInt('${{ steps.get_issue.outputs.issue_number }}', 10);
            
            if (!issueNumber || isNaN(issueNumber)) {
              core.setFailed("Número da issue inválido ou ausente.");
              return;
            }

            let result = { approved: false, feedback_summary: "Erro na leitura do resultado do agente.", required_actions: [] };
            try {
              result = JSON.parse(fs.readFileSync('./agent-review-result.json', 'utf8'));
            } catch (e) {
              console.log("Arquivo agent-review-result.json não encontrado ou inválido.");
            }
            
            if (result.approved) {
              await github.rest.issues.createComment({
                issue_number: issueNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `✅ **Aprovação Automática de Governança (ISO 29148 / EARS)**\n\nA Issue está em conformidade com as regras de especificação formal e pronta para codificação.`
              });
              await github.rest.issues.addLabels({
                issue_number: issueNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['status: ready-for-dev']
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: issueNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `⚠️ **Revisão de Qualidade Requer Alterações (ISO 29148 / EARS)**\n\n${result.feedback_summary}\n\n**Ações Necessárias:**\n` + 
                      result.required_actions.map(a => `- ${a}`).join('\n')
              });
              await github.rest.issues.addLabels({
                issue_number: issueNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['status: needs-refinement']
              });
            }